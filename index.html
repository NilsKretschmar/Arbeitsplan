<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbeitsplan</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background-color: var(--color-background-default);
        color: var(--color-text-primary);
      }
      
      :root {
        --color-background-default: #ffffff;
        --color-background-primary: #f6f6f6;
        --color-background-secondary: #eeeeee;
        --color-background-tertiary: #e0e0e0;
        --color-text-primary: #333333;
        --color-text-secondary: #666666;
        --color-text-tertiary: #999999;
        --color-text-info: #0078d4;
        --color-text-danger: #d13438;
        --color-text-success: #3b6d11;
        --color-border-tertiary: #d9d9d9;
        --color-border-success: #639922;
        --color-border-danger: #d13438;
        --border-radius-md: 4px;
        --border-radius-lg: 8px;
      }
      
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-default: #1e1e1e;
          --color-background-primary: #252526;
          --color-background-secondary: #2d2d30;
          --color-background-tertiary: #3e3e42;
          --color-text-primary: #e0e0e0;
          --color-text-secondary: #b0b0b0;
          --color-text-tertiary: #808080;
          --color-text-info: #59b4d4;
          --color-text-danger: #f48771;
          --color-text-success: #89d185;
          --color-border-tertiary: #3e3e42;
        }
      }
      
      button {
        background-color: var(--color-background-secondary);
        color: var(--color-text-primary);
        border: 0.5px solid var(--color-border-tertiary);
        padding: 6px 12px;
        border-radius: var(--border-radius-md);
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s;
      }
      
      button:hover {
        background-color: var(--color-background-tertiary);
      }
      
      input {
        background-color: var(--color-background-primary);
        color: var(--color-text-primary);
        border: 0.5px solid var(--color-border-tertiary);
        padding: 6px 8px;
        border-radius: var(--border-radius-md);
        font-size: 14px;
      }
      
      input:focus {
        outline: none;
        border-color: var(--color-text-info);
      }
      
      select {
        background-color: var(--color-background-primary);
        color: var(--color-text-primary);
        border: 0.5px solid var(--color-border-tertiary);
        padding: 6px 8px;
        border-radius: var(--border-radius-md);
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
